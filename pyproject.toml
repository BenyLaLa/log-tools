[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "company-log-tools"
version = "0.2.5"
description = "Local MCP server for downloading and investigating logs"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2", "paramiko>=4,<5", "pydantic>=2.11,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyftpdlib>=2,<3", "ruff>=0.11,<1"]
desktop = ["PySide6-Essentials>=6.8,<7", "tomlkit>=0.13,<1"]

[project.scripts]
log-tools = "log_tools.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

